[project]
name = "mentor-review"
version = "0.1.0"
description = "Industry Mentor LLM review-assistance tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-docx>=1.2",
    "pymupdf>=1.24",
    "pillow>=10",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "lxml>=6.1.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM (run with RUN_LIVE=1)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
